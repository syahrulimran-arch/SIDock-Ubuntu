[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidock-ubuntu"
version = "0.6.0.dev0"
description = "Headless AI-orchestrated AutoDock4 workflow derived from SIDock AD4 0.7.6"
authors = [{name = "Dr Syahrul Imran"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rdkit>=2023.9",
  "scipy>=1.10",
  "gemmi>=0.6",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sidock-ubuntu = "sidock_ubuntu.cli:main"
sidock = "sidock_ubuntu.cli:main"
sidock-gui = "sidock_ubuntu.gui:main"

[tool.setuptools.packages.find]
include = ["sidock_ubuntu*"]

[tool.setuptools.package-data]
sidock_ubuntu = ["static/*.css"]
